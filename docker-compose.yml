version: '3.8'

services:
  resortslite:
    image: ${IMAGE_NAME:-resortslite}:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_PORT=8080
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - REDIS_SSL=${REDIS_SSL:-false}
      - REPORT_BASE_PATH=${REPORT_BASE_PATH:-/app/data/reports}
      - BACKUP_PATH=${BACKUP_PATH:-/app/data/backups}
      - PAYMENT_API=${PAYMENT_API:-http://localhost:9090/payments/charge}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    volumes:
      - resortslite-data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

volumes:
  resortslite-data:
