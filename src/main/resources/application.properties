# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# Server port - externalized for dynamic port binding (cr-java-0077)
server.port=${PORT:8080}

# Database configuration - H2 in-memory (project's own database, unchanged)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3 configuration - for cr-java-0061, cr-java-0062, cr-java-0063
APP_S3_BUCKET=${APP_S3_BUCKET:resorts-lite-reports}
APP_REPORTS_PREFIX=${APP_REPORTS_PREFIX:reports/}
APP_SERVER_PORT=${APP_SERVER_PORT:8080}

# AWS Secrets Manager - for cr-java-0069 (DB credentials)
DB_SECRET_NAME=${DB_SECRET_NAME:}

# Database host - externalized (cr-java-0069)
DB_HOST=${DB_HOST:db-prod.resorts-internal.com}

# Redis configuration - for cr-java-0065 (Spring Session) and cr-java-0067 (cache)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Internal service endpoints (unchanged - not flagged by analysis report)
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Safe logging - prevent SDK wire logs from leaking secrets (cloud-services skill)
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
