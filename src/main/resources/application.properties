# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Replaced hard-coded port 8080 with an environment variable reference.
# SERVER_PORT is injected at runtime by ECS task definition, EKS pod spec, or Elastic Beanstalk
# environment configuration. The value should be stored in AWS Systems Manager Parameter Store
# and surfaced as an environment variable during deployment. Defaults to 8080 for local dev.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0069 FIX: AWS Secrets Manager configuration for database credentials.
# The secret identified by app.db.secret.name must be a JSON string of the form:
#   { "username": "<db-user>", "password": "<db-password>" }
# Override these values via environment variables or AWS Parameter Store in production.
app.db.secret.name=${APP_DB_SECRET_NAME:resortslite/db/credentials}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# =============================================================================
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session configuration
# =============================================================================
# Spring Session uses Redis as the distributed session store, replacing the
# default in-process HttpSession.  All session data is written to / read from
# the ElastiCache cluster, making every application instance fully stateless.
#
# REDIS_HOST must be set to the ElastiCache primary endpoint at runtime
# (e.g. via ECS task definition environment, Elastic Beanstalk env vars, or
# AWS Systems Manager Parameter Store).  Defaults to localhost for local dev.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Use Redis as the Spring Session store
spring.session.store-type=redis

# Session timeout — 30 minutes (matches @EnableRedisHttpSession maxInactiveIntervalInSeconds)
spring.session.timeout=30m

# Redis session namespace (avoids key collisions when multiple apps share a cluster)
spring.session.redis.namespace=resortsLite:session
