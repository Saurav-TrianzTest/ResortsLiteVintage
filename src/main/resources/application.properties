# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# Dynamic port assignment for ECS/EKS (cr-java-0077)
server.port=${PORT:8080}

# Database - H2 in-memory (kept as project's own test database)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database credentials externalized to AWS Secrets Manager (cr-java-0069)
# DB_SECRET_NAME env var holds the Secrets Manager secret name/ARN
# Secret JSON contains: {"username": "...", "password": "...", "host": "...", "port": ..., "database": "..."}

# S3 bucket for report storage (cr-java-0061, cr-java-0062, cr-java-0063)
# APP_S3_BUCKET env var holds the S3 bucket name
app.s3.bucket=${APP_S3_BUCKET:resorts-lite-reports}

# Redis / ElastiCache configuration for Spring Session and cache (cr-java-0065, cr-java-0067)
spring.session.store-type=redis
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms

# Internal service endpoints (unchanged - not in scope of ticked rules)
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Safe logging - prevent AWS SDK from logging secrets and wire data
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.io.lettuce.core=WARN
logging.level.org.springframework.data.redis=WARN
logging.level.com.zaxxer.hikari=INFO
