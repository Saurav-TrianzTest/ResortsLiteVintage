# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 FIX: Spring Session Data Redis configuration.
# Delegates all HttpSession storage to Amazon ElastiCache for Redis, enabling
# stateless application instances that can be freely load-balanced and auto-scaled.
# Set REDIS_HOST and REDIS_PORT via environment variables (ECS task definition,
# Elastic Beanstalk environment, or EC2 user-data) to point at your ElastiCache cluster.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800

# Redis / ElastiCache connection – override via environment variables at runtime.
# REDIS_HOST should be the ElastiCache Primary Endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# cr-java-0067 FIX: Booking cache TTL for Amazon ElastiCache for Redis.
# Controls how long booking entries are retained in the distributed Redis cache before
# automatic expiration. Prevents unbounded memory growth and stale data across instances.
# Override via environment variable APP_CACHE_BOOKING_TTL_MINUTES at runtime.
app.cache.booking.ttl-minutes=${APP_CACHE_BOOKING_TTL_MINUTES:30}

# cr-java-0069 FIX: AWS Secrets Manager configuration for database credentials.
# The secret must be a JSON object with "username" and "password" keys.
# Override via environment variables: AWS_SECRETSMANAGER_SECRET_NAME, AWS_REGION
aws.secretsmanager.secret-name=${AWS_SECRETSMANAGER_SECRET_NAME:resortslite/db/credentials}
aws.secretsmanager.region=${AWS_REGION:us-east-1}

# AWS S3 configuration – replaces hard-coded file-system paths (cr-java-0061)
# Override these via environment variables: AWS_S3_BUCKET_NAME, AWS_S3_REGION
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.reports-prefix=${AWS_S3_REPORTS_PREFIX:reports/}

# cr-java-0077 FIX: server.port is now bound to the SERVER_PORT environment variable.
# ECS task definitions, EKS pod specs, and Elastic Beanstalk environment configuration
# can inject SERVER_PORT at runtime to enable dynamic port assignment and service discovery.
# The default value of 8080 is used only when SERVER_PORT is not set in the environment.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
