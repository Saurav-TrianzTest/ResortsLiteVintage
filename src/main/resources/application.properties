# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
# cz-java-0061: port externalised; supply SERVER_PORT via ConfigMap
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0057: file paths externalised; supply via ConfigMap env vars
app.report.base-path=${REPORT_BASE_PATH:reports/}
app.report.backup-path=${REPORT_BACKUP_PATH:backups/nightly/}

# Health check endpoint (/actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# cz-java-0063: Spring Session backed by Amazon ElastiCache (Redis); supply via ConfigMap/Secret env vars
spring.session.store-type=redis
spring.session.redis.namespace=${SESSION_REDIS_NAMESPACE:resortslite:session}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL_ENABLED:false}

# cz-java-0070: booking cache stored in ElastiCache (Redis); supply via ConfigMap env vars
app.cache.booking.key-prefix=${BOOKING_CACHE_KEY_PREFIX:resortslite:booking:}
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
