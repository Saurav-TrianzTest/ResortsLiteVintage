# ResortsLite - Container-Ready Configuration
spring.application.name=ResortsLite

# Port from environment variable, default 8080
server.port=${APP_PORT:8080}

# Database configuration - credentials from environment variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# External service endpoints from environment variables
app.payment.endpoint=${PAYMENT_API_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:http://notify.internal:7070/send}

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG

# Active profile from environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
