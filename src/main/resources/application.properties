# ResortsLite - Legacy Configuration
# Externalised configuration for container deployment on GKE
spring.application.name=ResortsLite

# Port externalised via environment variable (cz-java-0061)
server.port=${APP_PORT:8080}

# Database configuration - credentials from environment variables
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# External service endpoints - from environment variables (cz-java-0062)
app.payment.endpoint=${PAYMENT_API_URL:http://payment-service:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:http://inventory-service:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:http://notify-service:7070/send}

# Redis configuration for externalized sessions and cache (cz-java-0063, cz-java-0069, cz-java-0070)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Spring Session - externalized to Redis (cz-java-0063, cz-java-0069)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.timeout=1800

# Spring Cache - Redis-backed (cz-java-0070)
spring.cache.type=redis
spring.cache.redis.time-to-live=1200000

# Actuator health check endpoint (containerization requirement)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
