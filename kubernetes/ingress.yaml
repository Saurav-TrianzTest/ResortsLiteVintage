apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resortslite-ingress
  namespace: "{{NAMESPACE}}"
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    kubernetes.io/ssl-redirect: "443"
spec:
  rules:
    - host: resortslite.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resortslite-service
                port:
                  number: 80
